<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" href="./assets/img/icon-pokedex.webp">
   <link rel="stylesheet" href="./assets/css/style.css">

   <title>Pokédex</title>
</head>

<body>

   <main>
      <img src="#" alt="pokemon" class="poke-img">

         <span class="poke-number"></span>
         <span class="poke-name"></span>
         <span class="poke-types"></span>
         <span class="poke-height"></span>
         <span class="poke-weight"></span>

      <form class="form">
         <input type="search" class="input-search" placeholder="Name or Number" required>
      </form>

      <div class="buttons">
         <button class="button btn-prev">&#60; Prev</button>
         <button class="button btn-next">Next &#62;</button>
      </div>

      <img src="./assets/img/pokedex.png" alt="pokedex" class="pokedex">

      <script src="./assets/js/script.js"></script>
   </main>

</body>

</html>
